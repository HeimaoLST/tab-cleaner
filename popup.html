<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Tidy</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="title">Tab Tidy (Rule Demo)</div>
      <div class="subtitle">Preview actions, then tidy in one click.</div>
    </header>

    <section class="settings">
      <label class="row">
        <span class="label">Mode</span>
        <select id="preset">
          <option value="safe">Safe</option>
          <option value="balanced">Balanced</option>
          <option value="aggressive">Aggressive</option>
        </select>
      </label>

      <label class="row">
        <span class="label">Decision</span>
        <select id="decisionEngine">
          <option value="rules">Rules</option>
          <option value="ai_stub">AI (experimental)</option>
        </select>
      </label>

      <label class="row">
        <span class="label">Max close per run</span>
        <input id="maxClosePerRun" type="number" min="0" step="1" />
      </label>

      <label class="row">
        <input id="keepPinned" type="checkbox" />
        <span>Keep pinned tabs</span>
      </label>

      <label class="row">
        <span class="label">Close old temp tabs (minutes)</span>
        <input id="closeOldTempTabsMinutes" type="number" min="0" step="1" />
      </label>

      <label class="row">
        <span class="label">Close old auth/redirect tabs (minutes)</span>
        <input id="closeOldAuthTabsMinutes" type="number" min="0" step="1" />
      </label>

      <details>
        <summary>Advanced</summary>
        <div class="advanced">
          <label class="row">
            <span class="label">Consider stale after (minutes)</span>
            <input id="staleMinutesToConsider" type="number" min="0" step="1" />
          </label>

          <label class="row">
            <span class="label">Low-value close threshold (0-1)</span>
            <input id="lowValueCloseThreshold" type="number" min="0" max="1" step="0.01" />
          </label>

          <label class="row">
            <span class="label">Auto-group if host activations ≥</span>
            <input id="frequentHostActivateCountForGrouping" type="number" min="0" step="1" />
          </label>

          <label class="row">
            <span class="label">Min tab age for low-value close (minutes)</span>
            <input id="minTabAgeMinutesForLowValueClose" type="number" min="0" step="1" />
          </label>

          <label class="row">
            <span class="label">Group min size</span>
            <input id="groupMinSize" type="number" min="2" step="1" />
          </label>

          <label class="row">
            <span class="label">AI candidate limit</span>
            <input id="candidateLimit" type="number" min="0" step="1" />
          </label>
        </div>
      </details>
    </section>

    <section class="actions">
      <button id="btnUndo">Undo</button>
      <button id="btnPreview">Preview</button>
      <button id="btnApply" class="primary">Tidy now</button>
    </section>

    <section class="summary" id="summary"></section>

    <section class="lists">
      <details open>
        <summary>Will close</summary>
        <div id="closeList" class="list"></div>
      </details>

      <details open>
        <summary>Will group</summary>
        <div id="groupList" class="list"></div>
      </details>
    </section>

    <footer>
      <div id="status" class="status"></div>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
